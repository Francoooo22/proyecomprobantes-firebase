<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel supervisor — Comprobantes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="admin">
  <header class="topbar">
    <div class="topbar-inner">
      <span class="logo small">Comprobantes</span>
      <div class="topbar-right">
        <span id="user-name" class="muted"></span>
        <a href="dashboard.html">Subir comprobante</a>
        <button id="btn-logout" class="btn-link">Salir</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Comprobantes del grupo</h2>
      <div class="filters">
        <label class="inline">
          <input type="checkbox" id="only-pending" checked> Solo pendientes
        </label>
        <input type="text" id="search" class="search" placeholder="Buscar por sucursal, monto, CUIT, N° de File…">
      </div>
      <div id="admin-list" class="list">
        <p class="muted">Cargando…</p>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-content">
      <button id="modal-close" class="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
